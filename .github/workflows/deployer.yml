name: Mettre en ligne chez OVH
# Le site est heberge uniquement chez OVH. GitHub range le code et, a chaque envoi sur main,
# construit le site puis le copie par FTP dans le dossier www de l'hebergement OVH.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "ovh"
  cancel-in-progress: false
jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construire le site (et verifier les villages)
        run: node construire.mjs
      # Identifiants FTP ranges dans Settings > Secrets and variables > Actions (jamais dans le code).
      - name: Envoyer le site chez OVH (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVEUR }}
          username: ${{ secrets.FTP_IDENTIFIANT }}
          password: ${{ secrets.FTP_MOT_DE_PASSE }}
          local-dir: ./dist/
          server-dir: ./www/
