name: Mettre en ligne sur GitHub Pages
# Le site est affiche par GitHub Pages (aucun mot de passe ne circule), a l'adresse nominamemoria.org
# (domaine achete chez OVH, declare dans public/CNAME). A chaque envoi sur main : construction puis publication.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construire le site (et verifier les villages)
        run: node construire.mjs
      - name: Preparer les fichiers pour Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
